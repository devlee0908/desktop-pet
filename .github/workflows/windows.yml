# Builds the Windows installers (MSI + NSIS setup.exe) on a Windows runner.
# Run it from the Actions tab (workflow_dispatch) or by pushing a tag like v0.1.0.
name: windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # beforeBuildCommand builds the MCP sidecar (pet-mcp-x86_64-pc-windows-msvc.exe) first
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
