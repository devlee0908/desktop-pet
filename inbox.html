<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>알림함</title>
    <style>
      :root {
        --bg: #f7f6f3; --side: #efede8; --card: #ffffff; --text: #1d1c1a; --muted: #6f6d68; --line: #e3e0d9; --hover: #e6e3dc;
        --accent: #1d1c1a; --accent-text: #fff;
        --info: #6FA8DC; --success: #8BC34A; --warning: #F2C14E; --error: #E06666;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1d1c1a; --side: #242320; --card: #2b2a27; --text: #f1efe9; --muted: #a09d96; --line: #3a3834; --hover: #34322e;
                --accent: #f1efe9; --accent-text: #1d1c1a; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
                   font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      body { display: grid; grid-template-columns: 210px 1fr; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

      /* sidebar: one row per solution (source) */
      aside { background: var(--side); border-right: 1px solid var(--line); padding: 14px 8px; overflow-y: auto; }
      aside h2 { margin: 2px 10px 10px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
      .src { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; text-align: left; }
      .src:hover { background: var(--hover); }
      .src.on { background: var(--accent); color: var(--accent-text); }
      .src .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .src .badge { flex: none; min-width: 20px; padding: 0 6px; border-radius: 10px; font-size: 11px; font-weight: 600; text-align: center;
                    background: var(--card); color: var(--text); border: 1px solid var(--line); }
      .src.on .badge { border-color: transparent; }
      .src .badge:empty { display: none; }

      main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      header h1 { margin: 0; font-size: 16px; font-weight: 650; flex: 1; min-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      header h1 small { margin-left: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
      .chips { display: flex; gap: 4px; }
      .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--line); font-size: 12px; background: var(--card); }
      .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
      .chip i, .item i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #000; flex: none; display: inline-block; }
      .actions { display: flex; gap: 6px; }
      .btn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); font-size: 12px; }
      .btn:hover { background: var(--hover); }
      .btn:disabled { opacity: .45; cursor: default; }
      .btn.danger.armed { background: var(--error); border-color: #000; color: #000; }

      #list { flex: 1; overflow-y: auto; padding: 10px 14px 18px; }
      .item { position: relative; display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 10px; align-items: baseline;
              padding: 10px 12px; margin-bottom: 6px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
      .item:hover { border-color: var(--muted); }
      .item i { transform: translateY(1px); }
      .item .title { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item.unread .title { font-weight: 700; }
      .item.unread::before { content: ""; position: absolute; left: -5px; top: 50%; width: 3px; height: 60%; transform: translateY(-50%); border-radius: 2px; background: var(--accent); }
      .item .time { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
      .item .msg { grid-column: 2 / 4; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap;
                   display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .item.open .msg { display: block; color: var(--text); }
      .item .tag { grid-column: 2 / 4; font-size: 11px; color: var(--muted); }
      .item .del { position: absolute; right: 8px; bottom: 6px; padding: 0 6px; border-radius: 5px; font-size: 15px; line-height: 20px; color: var(--muted); opacity: 0; }
      .item:hover .del { opacity: 1; }
      .item .del:hover { background: var(--hover); color: var(--text); }

      .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); text-align: center; }
      .empty .cat { width: 84px; height: 96px; opacity: .9; }
      .empty .cat svg { width: 100%; height: 100%; }
      .empty b { color: var(--text); font-weight: 600; }
    </style>
    <script type="module" src="/src/inbox.ts"></script>
  </head>
  <body>
    <aside>
      <h2>솔루션</h2>
      <nav id="sources"></nav>
    </aside>
    <main>
      <header>
        <h1 id="heading">모든 알림</h1>
        <div class="chips" id="levels"></div>
        <div class="actions">
          <button class="btn" id="read-all">모두 읽음</button>
          <button class="btn danger" id="clear">지우기</button>
        </div>
      </header>
      <section id="list" aria-live="polite"></section>
    </main>
  </body>
</html>
